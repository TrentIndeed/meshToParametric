<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mesh2param</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg-primary: #0D1117;
  --bg-secondary: #161B22;
  --bg-tertiary: #1C2128;
  --border: #30363D;
  --text-primary: #E6EDF3;
  --text-secondary: #8B949E;
  --text-muted: #484F58;
  --accent: #58A6FF;
  --accent-glow: #58A6FF33;
  --green: #3FB950;
  --orange: #D29922;
  --red: #F85149;
  --purple: #BC8CFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, sans-serif;
  overflow: hidden;
  height: 100vh;
}

/* ── Top Bar ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 100;
}
#topbar .left { display: flex; align-items: center; gap: 12px; }
#topbar .logo {
  font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#topbar .menu-btn {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
  border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 16px;
}
#topbar .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
#topbar .right { display: flex; align-items: center; gap: 16px; }
#topbar .tokens {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
}
#topbar .tokens i { color: var(--orange); }
#topbar .status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
}
#topbar .status-dot.done { background: var(--green); box-shadow: 0 0 8px var(--green); }
#topbar .status-dot.processing { background: var(--orange); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

/* ── Feature Tree (left sidebar) ── */
#sidebar {
  position: fixed; top: 48px; left: 0; bottom: 80px; width: 260px;
  background: var(--bg-secondary); border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 50;
}
#sidebar .header {
  padding: 12px 16px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.feature-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent;
  transition: all 0.15s;
}
.feature-item:hover { background: var(--bg-tertiary); }
.feature-item.active {
  background: var(--accent-glow); border-left-color: var(--accent);
}
.feature-item .icon {
  width: 24px; height: 24px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.feature-item .icon.sketch { background: #1a3a5c; color: var(--accent); }
.feature-item .icon.extrude { background: #1a3d1a; color: var(--green); }
.feature-item .icon.hole { background: #3d1a1a; color: var(--red); }
.feature-item .name { font-size: 13px; font-weight: 500; }
.feature-item .detail {
  font-size: 11px; color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace;
}

/* ── 3D Viewer ── */
#viewer {
  position: fixed; top: 48px; left: 260px; right: 0; bottom: 80px;
}

/* ── Bottom Timeline ── */
#timeline {
  position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
  background: var(--bg-secondary); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; overflow-x: auto; z-index: 50;
}
.timeline-step {
  flex-shrink: 0; width: 80px; height: 56px;
  background: var(--bg-tertiary); border: 2px solid var(--border);
  border-radius: 8px; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.timeline-step:hover { border-color: var(--text-secondary); }
.timeline-step.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.timeline-step .label {
  font-size: 9px; color: var(--text-secondary); text-align: center;
  position: absolute; bottom: 2px; left: 2px; right: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.timeline-step .step-num {
  font-size: 18px; font-weight: 700; color: var(--text-muted);
}

/* ── Action buttons ── */
#actions {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 60;
}
.action-btn {
  padding: 8px 20px; border-radius: 8px; border: none;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.15s;
}
.action-btn.primary {
  background: var(--accent); color: #000;
}
.action-btn.primary:hover { background: #79C0FF; }
.action-btn.secondary {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border);
}
.action-btn.secondary:hover { border-color: var(--accent); }

/* ── Empty state ── */
#empty-state {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--text-muted);
}
#empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
#empty-state p { font-size: 14px; margin-bottom: 16px; }

/* ── Loading overlay ── */
#loading {
  position: fixed; inset: 0; background: rgba(13,17,23,0.85);
  display: none; align-items: center; justify-content: center;
  z-index: 200; flex-direction: column; gap: 16px;
}
#loading.show { display: flex; }
#loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: var(--text-secondary); font-size: 14px; }

/* Hidden file input */
#file-input { display: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="left">
    <button class="menu-btn"><i class="ri-menu-line"></i></button>
    <span class="logo">mesh2param</span>
  </div>
  <div class="right">
    <span class="tokens"><i class="ri-sparkling-line"></i> <span id="token-count">0</span> tokens</span>
    <div class="status-dot" id="status-dot"></div>
  </div>
</div>

<!-- Feature Tree Sidebar -->
<div id="sidebar">
  <div class="header"><i class="ri-node-tree"></i> Feature Tree</div>
  <div id="feature-list">
    <!-- Populated by JS -->
  </div>
</div>

<!-- 3D Viewer -->
<div id="viewer">
  <div id="empty-state">
    <i class="ri-box-3-line"></i>
    <p>Drop a mesh file or click Upload</p>
  </div>
</div>

<!-- Action Buttons -->
<div id="actions">
  <button class="action-btn primary" onclick="document.getElementById('file-input').click()">
    <i class="ri-upload-2-line"></i> Upload File
  </button>
  <button class="action-btn secondary" id="btn-onshape" disabled>
    <i class="ri-send-plane-line"></i> Send to Onshape
  </button>
</div>
<input type="file" id="file-input" accept=".stl,.obj,.ply,.3mf">

<!-- Bottom Timeline -->
<div id="timeline">
  <!-- Populated by JS -->
</div>

<!-- Loading Overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Processing mesh...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" type="module"></script>
<script src="/static/app.js" type="module"></script>
</body>
</html>
