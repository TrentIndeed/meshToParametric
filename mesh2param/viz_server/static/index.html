<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mesh2param</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.openai.com/API/fonts.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg-primary: #0D1117;
  --bg-secondary: #161B22;
  --bg-tertiary: #1C2128;
  --border: #30363D;
  --text-primary: #E6EDF3;
  --text-secondary: #8B949E;
  --text-muted: #484F58;
  --accent: #58A6FF;
  --accent-glow: #58A6FF33;
  --green: #3FB950;
  --orange: #D29922;
  --red: #F85149;
  --purple: #BC8CFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'OpenAI Sans', -apple-system, sans-serif;
  overflow: hidden;
  height: 100vh;
}

/* ── Top Bar ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 100;
}
#topbar .left { display: flex; align-items: center; gap: 12px; }
#topbar .logo {
  font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#topbar .menu-btn {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
  border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 16px;
}
#topbar .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
#topbar .right { display: flex; align-items: center; gap: 16px; }
#topbar .tokens {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
}
#topbar .tokens i { color: var(--orange); }
#topbar .status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
}
#topbar .status-dot.done { background: var(--green); box-shadow: 0 0 8px var(--green); }
#topbar .status-dot.processing { background: var(--orange); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

/* ── Feature Tree (left sidebar) — collapsible ── */
#sidebar {
  position: fixed; top: 48px; left: 0; bottom: 80px; width: 260px;
  background: var(--bg-secondary); border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 50; transition: width 0.2s ease;
}
#sidebar.collapsed { width: 48px; }
#sidebar .header {
  padding: 12px 16px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  white-space: nowrap; overflow: hidden;
}
#sidebar.collapsed .header { padding: 12px 14px; justify-content: center; }
#sidebar.collapsed .header span { display: none; }
.feature-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent;
  transition: all 0.15s; overflow: hidden; white-space: nowrap;
}
#sidebar.collapsed .feature-item { padding: 8px 12px; justify-content: center; }
#sidebar.collapsed .feature-item > div { display: none; }
.feature-item:hover { background: var(--bg-tertiary); }
.feature-item.active {
  background: var(--accent-glow); border-left-color: var(--accent);
}
.feature-item .icon {
  width: 24px; height: 24px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.feature-item .icon.sketch { background: #1a3a5c; color: var(--accent); }
.feature-item .icon.extrude { background: #1a3d1a; color: var(--green); }
.feature-item .icon.hole { background: #3d1a1a; color: var(--red); }
.feature-item .name { font-size: 13px; font-weight: 500; }
.feature-item .detail {
  font-size: 11px; color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace;
}

/* ── 3D Viewer — adapts to collapsed panels ── */
#viewer {
  position: fixed; top: 48px; left: 260px; right: 300px; bottom: 80px;
  transition: left 0.2s ease, right 0.2s ease;
}
body.sidebar-collapsed #viewer { left: 48px; }
body.chat-collapsed #viewer { right: 0; }

/* ── AI Chat Panel (right sidebar) — collapsible ── */
#chat-panel {
  position: fixed; top: 48px; right: 0; bottom: 80px; width: 300px;
  background: var(--bg-secondary); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 50;
  transition: width 0.2s ease;
}
#chat-panel.collapsed { width: 0; overflow: hidden; border: none; }
#chat-panel .header {
  padding: 12px 16px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  white-space: nowrap;
}

/* ── Toggle buttons for collapsed panels ── */
.panel-toggle {
  position: fixed; z-index: 60; background: var(--bg-tertiary);
  border: 1px solid var(--border); color: var(--text-secondary);
  width: 28px; height: 28px; border-radius: 6px;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px;
}
.panel-toggle:hover { border-color: var(--accent); color: var(--accent); }
#toggle-chat { right: 8px; top: 56px; }
body.chat-collapsed #toggle-chat { display: flex; }
#chat-messages {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.chat-msg {
  max-width: 90%; padding: 8px 12px; border-radius: 12px;
  font-size: 13px; line-height: 1.4; word-wrap: break-word;
}
.chat-msg.user {
  align-self: flex-end; background: var(--accent);
  color: #000; border-bottom-right-radius: 4px;
}
.chat-msg.ai {
  align-self: flex-start; background: var(--bg-tertiary);
  color: var(--text-primary); border-bottom-left-radius: 4px;
}
.chat-msg.system {
  align-self: center; background: none; color: var(--text-muted);
  font-size: 11px; font-style: italic;
}
#chat-input-row {
  padding: 8px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
#chat-input {
  flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; color: var(--text-primary);
  font-family: 'OpenAI Sans', sans-serif; font-size: 13px; outline: none;
}
#chat-input:focus { border-color: var(--accent); }
#chat-input::placeholder { color: var(--text-muted); }
#chat-send {
  background: var(--accent); border: none; border-radius: 8px;
  padding: 8px 12px; cursor: pointer; color: #000; font-size: 14px;
}
#chat-send:hover { background: #79C0FF; }
.chat-typing { color: var(--text-muted); font-size: 12px; padding: 4px 12px; }

/* ── Dimension Review Modal ── */
#dim-modal {
  position: fixed; inset: 0; background: rgba(13,17,23,0.9);
  display: none; align-items: center; justify-content: center;
  z-index: 300;
}
#dim-modal.show { display: flex; }
#dim-modal .card {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; max-width: 480px; width: 90%;
}
#dim-modal h2 {
  font-size: 16px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
#dim-modal h2 i { color: var(--accent); }
#dim-modal .dim-row {
  display: flex; justify-content: space-between; padding: 6px 0;
  font-size: 13px; border-bottom: 1px solid var(--border);
}
#dim-modal .dim-row .label { color: var(--text-secondary); }
#dim-modal .dim-row .value { font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
#dim-modal .notes {
  margin-top: 12px; padding: 10px; background: var(--bg-tertiary);
  border-radius: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.5;
}
#dim-modal .buttons {
  margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end;
}
#dim-modal .buttons button {
  padding: 8px 20px; border-radius: 8px; border: none;
  font-family: 'OpenAI Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
}
#dim-modal .btn-confirm { background: var(--accent); color: #000; }
#dim-modal .btn-confirm:hover { background: #79C0FF; }
#dim-modal .btn-skip { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
#dim-modal .btn-skip:hover { border-color: var(--accent); }

/* ── Bottom Timeline ── */
#timeline {
  position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
  background: var(--bg-secondary); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; overflow-x: auto; z-index: 50;
}
.timeline-step {
  flex-shrink: 0; width: 80px; height: 56px;
  background: var(--bg-tertiary); border: 2px solid var(--border);
  border-radius: 8px; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.timeline-step:hover { border-color: var(--text-secondary); }
.timeline-step.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.timeline-step .label {
  font-size: 9px; color: var(--text-secondary); text-align: center;
  position: absolute; bottom: 2px; left: 2px; right: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.timeline-step .step-num {
  font-size: 18px; font-weight: 700; color: var(--text-muted);
}

/* ── Action buttons ── */
#actions {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 60;
}
.action-btn {
  padding: 8px 20px; border-radius: 8px; border: none;
  font-family: 'OpenAI Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.15s;
}
.action-btn.primary {
  background: var(--accent); color: #000;
}
.action-btn.primary:hover { background: #79C0FF; }
.action-btn.secondary {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border);
}
.action-btn.secondary:hover { border-color: var(--accent); }

/* ── Empty state ── */
#empty-state {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--text-muted);
}
#empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
#empty-state p { font-size: 14px; margin-bottom: 16px; }

/* ── Loading overlay ── */
#loading {
  position: fixed; inset: 0; background: rgba(13,17,23,0.85);
  display: none; align-items: center; justify-content: center;
  z-index: 200; flex-direction: column; gap: 16px;
}
#loading.show { display: flex; }
#loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: var(--text-secondary); font-size: 14px; }

/* Hidden file input */
#file-input { display: none; }

/* ── Responsive: auto-collapse on narrow windows ── */
@media (max-width: 1100px) {
  #sidebar { width: 48px; }
  #sidebar .header span { display: none; }
  #sidebar .header { padding: 12px 14px; justify-content: center; }
  #sidebar .feature-item { padding: 8px 12px; justify-content: center; }
  #sidebar .feature-item > div { display: none; }
  #viewer { left: 48px; }
}
@media (max-width: 900px) {
  #chat-panel { width: 0; overflow: hidden; border: none; }
  #viewer { right: 0; }
  #toggle-chat { display: flex; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="left">
    <button class="menu-btn"><i class="ri-menu-line"></i></button>
    <span class="logo">mesh2param</span>
  </div>
  <div class="right">
    <span class="tokens"><i class="ri-sparkling-line"></i> <span id="token-count">0</span> tokens</span>
    <div class="status-dot" id="status-dot"></div>
  </div>
</div>

<!-- Feature Tree Sidebar (click header to collapse) -->
<div id="sidebar">
  <div class="header" onclick="toggleSidebar()"><i class="ri-node-tree"></i> <span>Feature Tree</span></div>
  <div id="feature-list">
    <!-- Populated by JS -->
  </div>
</div>

<!-- 3D Viewer -->
<div id="viewer">
  <div id="empty-state">
    <i class="ri-box-3-line"></i>
    <p>Drop a mesh file or click Upload</p>
  </div>
</div>

<!-- Chat toggle (visible when collapsed) -->
<button class="panel-toggle" id="toggle-chat" onclick="toggleChat()"><i class="ri-robot-2-line"></i></button>

<!-- AI Chat Panel (right sidebar, click header to collapse) -->
<div id="chat-panel">
  <div class="header" onclick="toggleChat()"><i class="ri-robot-2-line"></i> AI Assistant</div>
  <div id="chat-messages">
    <div class="chat-msg system">Upload a mesh to start. Ask me to analyze dimensions or edit features.</div>
  </div>
  <div id="chat-input-row">
    <input id="chat-input" placeholder="Ask about the model..." disabled>
    <button id="chat-send" disabled><i class="ri-send-plane-fill"></i></button>
  </div>
</div>

<!-- Dimension Review Modal -->
<div id="dim-modal">
  <div class="card">
    <h2><i class="ri-ruler-line"></i> Dimension Analysis</h2>
    <div id="dim-part-type"></div>
    <div id="dim-rows"></div>
    <div id="dim-notes" class="notes"></div>
    <div class="buttons">
      <button class="btn-skip" onclick="skipDimensionReview()">Skip & Build</button>
      <button class="btn-confirm" onclick="confirmDimensionReview()">Confirm & Build</button>
    </div>
  </div>
</div>

<!-- Action Buttons -->
<div id="actions">
  <button class="action-btn primary" onclick="document.getElementById('file-input').click()">
    <i class="ri-upload-2-line"></i> Upload File
  </button>
  <button class="action-btn secondary" id="btn-onshape" disabled>
    <i class="ri-send-plane-line"></i> Send to Onshape
  </button>
</div>
<input type="file" id="file-input" accept=".stl,.obj,.ply,.3mf">

<!-- Bottom Timeline -->
<div id="timeline">
  <!-- Populated by JS -->
</div>

<!-- Loading Overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Processing mesh...</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="/static/app.js" type="module"></script>
</body>
</html>
