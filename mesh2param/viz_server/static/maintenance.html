<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance — Paramesh AI</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0B; --bg-card: #161618; --border: #27272A;
  --text: #FAFAFA; --text-secondary: #A1A1AA; --text-muted: #52525B;
  --accent: #22D3EE; --accent-dim: rgba(34,211,238,0.08); --accent-border: rgba(34,211,238,0.15);
  --orange: #F59E0B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Outfit', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 2rem;
}
.icon {
  width: 80px; height: 80px; border-radius: 20px;
  background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.15);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 2rem;
}
.icon svg { color: var(--orange); }
h1 {
  font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700;
  letter-spacing: -0.02em; margin-bottom: 0.75rem;
}
p {
  color: var(--text-secondary); font-size: 1.05rem;
  line-height: 1.6; max-width: 500px; margin-bottom: 1rem;
}
.status-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.25rem 2rem; margin: 2rem 0;
  display: inline-flex; align-items: center; gap: 0.75rem;
}
.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--orange); animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: 0.4; } }
.status-text { font-size: 0.9rem; color: var(--text-secondary); }
.links {
  margin-top: 2rem; display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
}
.links a {
  color: var(--text-muted); text-decoration: none; font-size: 0.9rem;
  font-weight: 500; transition: color 0.2s;
}
.links a:hover { color: var(--accent); }
.refresh {
  margin-top: 2.5rem; display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.7rem 1.75rem; border-radius: 8px; font-size: 0.95rem;
  font-weight: 600; font-family: 'Outfit', sans-serif;
  cursor: pointer; background: var(--accent); color: var(--bg);
  border: none; transition: all 0.2s; text-decoration: none;
}
.refresh:hover { background: #06B6D4; }
</style>
</head>
<body>
  <div class="icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </div>
  <h1>We'll be right back</h1>
  <p>Paramesh AI is undergoing scheduled maintenance. We're upgrading the pipeline to make your conversions faster and more accurate.</p>
  <div class="status-box">
    <div class="status-dot"></div>
    <span class="status-text">Maintenance in progress</span>
  </div>
  <p style="font-size:0.9rem; color:var(--text-muted);">This usually takes less than 15 minutes.</p>
  <a href="/" class="refresh" onclick="location.reload(); return false;">Try Again</a>
  <div class="links">
    <a href="https://twitter.com/parameshai">Status on X</a>
    <a href="/contact">Contact Support</a>
  </div>
</body>
</html>
