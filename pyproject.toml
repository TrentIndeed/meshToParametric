[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh2param"
version = "0.1.0"
description = "Reverse engineering pipeline: mesh to parametric CAD via Onshape"
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.0",
    "fast-simplification>=0.1",  # deterministic decimation backend for trimesh
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "networkx>=3.1",
    "pymeshfix>=0.16",
    "requests>=2.31",
    "click>=8.1",
    "pydantic>=2.0",
    "shapely>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyvista>=0.43",
    "matplotlib>=3.8",
    "distinctipy>=1.3",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "pytest-timeout",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
mesh2param = "mesh2param.cli:main"

[tool.setuptools.packages.find]
include = ["mesh2param*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Kill any single test that runs >10 min — CadQuery/OCC boolean ops can hang
# on meshes the pipeline doesn't fully support yet.
timeout = 600
timeout_method = "thread"
markers = [
    "visual: tests that generate visualization output",
    "slow: tests that take > 10s (e.g. Onshape API)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "_render_out", "models"]

[tool.ruff.lint]
# Default E4/E7/E9 + F (pyflakes); keep the bar enforceable in CI.
select = ["E4", "E7", "E9", "F"]
# Math-heavy code uses single-letter names like l for labels.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# app.py must run faulthandler/load_dotenv before the heavy imports.
"mesh2param/viz_server/app.py" = ["E402"]
# Scratch debug/render scripts kept for reference, not collected by pytest.
"tests/debug_*.py" = ["E402", "F403", "F405", "F841", "E702"]
"tests/render_*.py" = ["E402", "F403", "F405", "F841", "E702"]
"scripts/*" = ["E402", "F403", "F405", "F841", "E702"]
