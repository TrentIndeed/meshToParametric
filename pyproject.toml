[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh2param"
version = "0.1.0"
description = "Reverse engineering pipeline: mesh to parametric CAD via Onshape"
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pymeshfix>=0.16",
    "requests>=2.31",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[project.scripts]
mesh2param = "mesh2param.cli:main"

[tool.setuptools.packages.find]
include = ["mesh2param*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
